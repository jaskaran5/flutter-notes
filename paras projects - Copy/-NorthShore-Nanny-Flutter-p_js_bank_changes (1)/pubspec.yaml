name: northshore_nanny_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.1.4+19

environment:
  sdk: '>=3.2.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
#  cupertino_icons: ^1.0.6
  get: ^4.6.6
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.3
  pin_code_fields: ^8.0.1
  dropdown_search: ^5.0.6
  flutter_xlider: ^3.5.0
  table_calendar: ^3.1.2
  google_maps_flutter: ^2.9.0
  cached_network_image: ^3.4.0
  flutter_time_picker_spinner: ^2.0.0
  flutter_rating_bar: ^4.0.1
  intl:
  get_storage: ^2.1.1
  webview_flutter: ^4.8.0
  bot_toast: ^4.1.3
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  auto_size_text: ^3.0.0
  firebase_messaging: ^15.0.4
  firebase_core: ^3.3.0
  connectivity_plus: ^6.0.5
  tuple: ^2.0.2
  permission_handler: ^11.3.1
  geocoding: ^3.0.0
  lottie: ^3.1.2
  image_cropper: ^8.0.1
  widget_to_marker: ^1.0.6
  shimmer: ^3.0.0
  skeletonizer: ^1.4.2
  signalr_netcore: ^1.3.9
  file_picker: ^8.0.7
  flutter_keyboard_visibility: ^6.0.0
  grouped_list: ^6.0.0
  video_player: ^2.9.1
  flutter_local_notifications: ^17.2.2
  full_screen_image: ^2.0.0
  video_thumbnail: ^0.5.3
  path_provider: ^2.1.4
  http: any
  flutter_timezone: ^2.1.0
  sign_in_with_apple: ^6.1.1
  firebase_auth: ^5.1.4
  flutter_secure_storage: ^9.2.2
  share_plus: ^10.0.0
  google_places_flutter: ^2.0.9
  in_app_review: ^2.0.9



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0





flutter:


  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/images/
    - assets/animation/
    - assets/
    - assets/fonts/
    - assets/fonts/urbanist/
    - assets/fonts/playfairDisplay/
  #   - images/a_dot_ham.jpeg


  fonts:
     - family: PlayfairDisplay
       fonts:
         - asset: assets/fonts/playfairDisplay/PlayfairDisplay-Regular.ttf
           weight: 400
         - asset: assets/fonts/playfairDisplay/PlayfairDisplay-Medium.ttf
           weight: 500
         - asset: assets/fonts/playfairDisplay/PlayfairDisplay-SemiBold.ttf
           weight: 600
         - asset: assets/fonts/playfairDisplay/PlayfairDisplay-Bold.ttf
           weight: 700
         - asset: assets/fonts/playfairDisplay/PlayfairDisplay-ExtraBold.ttf
           weight: 800
         - asset: assets/fonts/playfairDisplay/PlayfairDisplay-Black.ttf
           weight: 900
     - family: Urbanist
       fonts:
         - asset: assets/fonts/urbanist/Urbanist-Regular.ttf
           weight: 400
         - asset: assets/fonts/urbanist/Urbanist-Medium.ttf
           weight: 500
         - asset: assets/fonts/urbanist/Urbanist-SemiBold.ttf
           weight: 600
         - asset: assets/fonts/urbanist/Urbanist-Bold.ttf
           weight: 700

  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
